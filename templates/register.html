{% extends "base.html" %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<div class="auth-container">
    <h2>Регистрация</h2>
    <form id="register-form" class="auth-form" method="POST">
        <div class="form-group">
            <label for="full_name">ФИО</label>
            <input type="text" id="full_name" name="full_name" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" required minlength="6">
        </div>
        <div class="form-group">
            <label for="confirm_password">Подтверждение пароля</label>
            <input type="password" id="confirm_password" name="confirm_password" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Зарегистрироваться</button>
    </form>
    <p class="auth-link">Уже есть аккаунт? <a href="/login">Войти</a></p>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/auth.js"></script>{% endblock %}
