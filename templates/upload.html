{% extends "base.html" %}
{% block title %}Загрузка отчёта{% endblock %}
{% block content %}
<div class="upload-container">
    <div class="upload-header">
        <h2>Загрузка отчёта о практике</h2>
        <button id="clear-draft-btn" class="btn btn-sm btn-danger" style="display:none;">🗑 Очистить черновик</button>
    </div>
    
    <form id="upload-form" enctype="multipart/form-data">
        <div class="form-group">
            <label for="report-template">Название отчёта *</label>
            <select id="report-template" name="title" required>
                <option value="">Загрузка...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="subject">Предмет *</label>
            <select id="subject" name="subject_id" required>
                <option value="">Загрузка...</option>
            </select>
        </div>

        <div class="form-group">
            <label for="practice_type">Тип практики *</label>
            <select id="practice_type" name="practice_type" required>
                <option value="">Загрузка...</option>
            </select>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="practice_start">Начало практики *</label>
                <input type="date" id="practice_start" name="practice_start" required>
            </div>
            <div class="form-group">
                <label for="practice_end">Окончание практики *</label>
                <input type="date" id="practice_end" name="practice_end" required>
            </div>
        </div>

        <div class="form-group">
            <label for="description">Описание</label>
            <textarea id="description" name="description" rows="4" placeholder="Краткое описание..."></textarea>
        </div>

        <div class="form-group">
            <label for="file">Файл отчёта *</label>
            <input type="file" id="file" name="file" required accept=".pdf,.doc,.docx,.odt,.txt,.zip,.rar">
        </div>

        <div id="upload-progress" class="progress-bar" style="display:none;">
            <div class="progress-fill"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="submit-btn">
            Загрузить отчёт
        </button>
    </form>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    // Загрузка шаблонов
    fetch('/api/report-templates')
        .then(res => res.json())
        .then(templates => {
            const sel = document.getElementById('report-template');
            if (!templates || templates.length === 0) {
                sel.innerHTML = '<option value="">Нет доступных шаблонов</option>';
                return;
            }
            sel.innerHTML = '<option value="">Выберите название отчёта</option>';
            templates.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.title;
                opt.textContent = t.title;
                sel.appendChild(opt);
            });
        })
        .catch(err => {
            console.error('Ошибка загрузки шаблонов:', err);
            document.getElementById('report-template').innerHTML = '<option value="">Ошибка сети</option>';
        });

    // Загрузка предметов
    fetch('/api/subjects')
        .then(res => res.json())
        .then(subjects => {
            const sel = document.getElementById('subject');
            if (!subjects || subjects.length === 0) {
                sel.innerHTML = '<option value="">Нет доступных предметов</option>';
                return;
            }
            sel.innerHTML = '<option value="">Выберите предмет</option>';
            subjects.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.id;
                opt.textContent = s.name;
                sel.appendChild(opt);
            });
        })
        .catch(err => {
            console.error('Ошибка загрузки предметов:', err);
            document.getElementById('subject').innerHTML = '<option value="">Ошибка сети</option>';
        });

    // Загрузка типов практик
    fetch('/api/practice-types')
        .then(res => res.json())
        .then(types => {
            const sel = document.getElementById('practice_type');
            if (!types || types.length === 0) {
                sel.innerHTML = '<option value="">Нет доступных типов</option>';
                return;
            }
            sel.innerHTML = '<option value="">Выберите тип</option>';
            types.forEach(t => {
                const opt = document.createElement('option');
                opt.value = t.name;
                opt.textContent = t.name;
                sel.appendChild(opt);
            });
        })
        .catch(err => {
            console.error('Ошибка загрузки типов практик:', err);
            document.getElementById('practice_type').innerHTML = '<option value="">Ошибка сети</option>';
        });
});
</script>
{% endblock %}
{% block scripts %}
<script src="/static/js/main.js"></script>
<script src="/static/js/upload.js"></script>
{% endblock %}
